name: Live E2E (BugSplat)

on:
    workflow_dispatch:
    schedule:
        - cron: '17 6 * * 1'

jobs:
    live:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Linux display and sandbox setup
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libxss1 libgtk-3-0
                  sudo chown root:root node_modules/electron/dist/chrome-sandbox
                  sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

            - name: Build
              run: npm run build && npm run build:example

            - name: Live E2E
              env:
                  BUGSPLAT_DATABASE: ${{ secrets.BUGSPLAT_DATABASE }}
                  BUGSPLAT_CLIENT_ID: ${{ secrets.BUGSPLAT_CLIENT_ID }}
                  BUGSPLAT_CLIENT_SECRET: ${{ secrets.BUGSPLAT_CLIENT_SECRET }}
              run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run e2e:live
