name: CI

on:
    pull_request:
        branches: [main, beta]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-version: [22, 24]
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Typecheck
              run: npm run typecheck

            - name: Unit tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Check package exports
              run: npm run check:exports

            - name: Check dist shape
              run: npm run test:dist

            - name: Upload dist
              if: matrix.node-version == 24
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist

    e2e:
        needs: test
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      electron: 42.10.1
                    - os: ubuntu-latest
                      electron: 43.4.1
                    - os: ubuntu-latest
                      electron: 44.0.0
                    - os: macos-latest
                      electron: 44.0.0
                    - os: windows-latest
                      electron: 44.0.0
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Pin Electron ${{ matrix.electron }}
              run: npm i --no-save electron@${{ matrix.electron }}

            - name: Linux display and sandbox setup
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libxss1 libgtk-3-0
                  sudo chown root:root node_modules/electron/dist/chrome-sandbox
                  sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

            - name: E2E (Linux)
              if: runner.os == 'Linux'
              run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run e2e

            - name: E2E
              if: runner.os != 'Linux'
              run: npm run e2e

            - name: Upload e2e artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-${{ matrix.os }}-electron-${{ matrix.electron }}
                  path: e2e/artifacts
                  if-no-files-found: ignore

    e2e-floor:
        # Best-effort signal for the declared peer floor (electron >=35). Not a gate.
        needs: test
        runs-on: ubuntu-latest
        timeout-minutes: 30
        continue-on-error: true
        steps:
            - uses: actions/checkout@v4

            - name: Use Node.js 24
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Pin Electron 35
              run: npm i --no-save electron@35

            - name: Linux display and sandbox setup
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb libnss3 libgbm1 libasound2t64 libxss1 libgtk-3-0
                  sudo chown root:root node_modules/electron/dist/chrome-sandbox
                  sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

            - name: E2E (Linux)
              run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run e2e
